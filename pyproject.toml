[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hp3458a-studio"
version = "0.5.2"
description = "Bilingual, crash-resilient acquisition and analysis for mixed precision DMMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Louis"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
  "pyvisa>=1.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyinstaller>=6.10",
  "ruff>=0.16",
]

[project.scripts]
hp3458a-studio = "hp3458a_studio.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
