name: dotnet-rewrite

on:
  push:
    branches:
      - rewrite/dotnet10
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-rewrite.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - ".github/workflows/dotnet-rewrite.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore dotnet/PrecisionLab.slnx
      - name: Build
        run: dotnet build dotnet/PrecisionLab.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test dotnet/PrecisionLab.slnx --configuration Release --no-build
