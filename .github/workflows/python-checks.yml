name: Python checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Test
        shell: pwsh
        run: |
          # Exercise native Windows font/layout behavior first so a regression
          # fails promptly, while keeping every test in the full run exactly once.
          $remainingTests = Get-ChildItem tests/test_*.py | Where-Object { $_.Name -ne 'test_ui_lifecycle.py' } | Select-Object -ExpandProperty FullName
          python -m pytest -q -x tests/test_ui_lifecycle.py $remainingTests
      - name: Build Windows application
        if: matrix.python == '3.11'
        run: python -m PyInstaller --noconfirm --clean 3458A_Lab_Studio.spec
      - name: Upload Windows application
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: Precision-Lab-Studio-Windows
          path: dist/Precision-Multi-Instrument-Lab-Studio.exe
          if-no-files-found: error
      - name: Exercise frozen executable without hardware
        if: matrix.python == '3.11'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:QT_QPA_PLATFORM = 'windows'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath 'dist/Precision-Multi-Instrument-Lab-Studio.exe' -ArgumentList '--smoke-test', 'dist/frozen-smoke.json' -PassThru
          if (-not $process.WaitForExit(60000)) { Stop-Process -Id $process.Id -Force; throw 'Frozen executable did not finish within 60 seconds' }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Frozen executable smoke failed: $($process.ExitCode)" }
          $report = Get-Content 'dist/frozen-smoke.json' -Raw | ConvertFrom-Json
          if ($report.result -ne 'passed') { throw 'Simulation validation failed' }
      - name: Upload frozen validation report
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: Windows-frozen-validation
          path: |
            dist/frozen-smoke.json
            dist/frozen-smoke*.png
